<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izibulo Electrical — Residential &amp; Commercial Electrical Contractors</title>
<meta name="description" content="Izibulo Electrical — licensed, COC-certified electrical contractors serving Midrand and surrounds. Residential and commercial work, 24/7 emergency callouts.">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#14213D">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    color-scheme:light;
    --navy:#14213D;
    --navy-2:#1F2F52;
    --blue:#2F6FEB;
    --blue-light:#EAF1FE;
    --slate:#5B6472;
    --ink:#1B2130;
    --paper:#FFFFFF;
    --panel:#F6F8FB;
    --line:#E3E8F0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.55;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Sora',sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--navy);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;}
  :focus-visible{outline:3px solid var(--blue); outline-offset:2px;}

  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;max-width:1120px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:1.1rem;color:var(--navy);font-weight:700;}
  .brand .bolt{width:30px;height:30px;flex-shrink:0;}
  .navlinks{display:flex;gap:30px;font-size:0.9rem;font-weight:600;color:var(--slate);}
  .navlinks a{transition:color .15s;}
  .navlinks a:hover{color:var(--blue);}
  .cta-btn{
    background:var(--blue);color:#fff;font-weight:600;
    padding:11px 22px;font-size:0.86rem;border-radius:8px;
    border:none;cursor:pointer;transition:transform .12s, background .15s, box-shadow .15s;
    font-family:'Inter',sans-serif;
    box-shadow:0 4px 14px rgba(47,111,235,0.28);
  }
  .cta-btn:hover{background:#255bd1;transform:translateY(-1px);}
  .cta-btn.outline{
    background:transparent;color:var(--navy);border:1.5px solid var(--line);box-shadow:none;
  }
  .cta-btn.outline:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}
  .menu-toggle{
    display:none;background:none;border:1px solid var(--line);border-radius:8px;
    width:40px;height:40px;cursor:pointer;color:var(--navy);
    align-items:center;justify-content:center;
  }
  .mobile-nav{
    display:none;
    position:fixed;top:65px;left:0;right:0;bottom:0;z-index:49;
    background:#fff;padding:24px;
    flex-direction:column;gap:4px;
  }
  .mobile-nav.open{display:flex;}
  .mobile-nav a{
    padding:16px 4px;font-size:1.05rem;font-weight:600;color:var(--navy);
    border-bottom:1px solid var(--line);
  }
  .mobile-nav .cta-btn{margin-top:16px;text-align:center;}

  .hero{
    position:relative;
    padding:90px 24px 70px;
    overflow:hidden;
    background:linear-gradient(180deg, #FBFCFE 0%, #FFFFFF 100%);
  }
  .hero-inner{
    max-width:1120px;margin:0 auto;
    display:grid;grid-template-columns:1.05fr 0.95fr;gap:40px;align-items:center;
  }
  .hero-copy{text-align:left;}
  .hero-visual{position:relative;}
  .circuit-bg{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0.5; pointer-events:none;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:0.75rem;letter-spacing:0.08em;
    color:var(--blue);text-transform:uppercase;margin-bottom:22px;
    background:var(--blue-light);padding:7px 16px;border-radius:100px;font-weight:600;
    position:relative;
  }
  .hero h1{
    font-size:clamp(2rem, 4.4vw, 3.1rem);
    line-height:1.1;
    letter-spacing:-0.015em;
    position:relative;
  }
  .hero h1 .accent{color:var(--blue);}
  .hero p{
    max-width:480px;margin:22px 0 34px;
    color:var(--slate);font-size:1.06rem;
    position:relative;
  }
  .hero-ctas{display:flex;gap:14px;flex-wrap:wrap;position:relative;}
  .cta-btn .arrow{margin-left:8px;vertical-align:-2px;transition:transform .15s;}
  .cta-btn:hover .arrow{transform:translateX(3px);}

  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .stat{
    padding:26px 16px;text-align:center;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none;}
  .stat .num{
    font-family:'IBM Plex Mono',monospace;font-weight:600;
    font-size:1.15rem;color:var(--blue);
  }
  .stat .label{
    font-size:0.78rem;
    color:var(--slate);margin-top:5px;
  }

  .section{padding:88px 24px;}
  .section-head{max-width:620px;margin:0 auto 52px;text-align:center;}
  .section-head .tag{
    font-family:'IBM Plex Mono',monospace;color:var(--blue);
    font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;
  }
  .section-head h2{font-size:clamp(1.7rem,3.6vw,2.3rem);margin-top:12px;}
  .section-head p{color:var(--slate);margin-top:14px;font-size:1.02rem;}

  .plates{
    display:grid;grid-template-columns:1fr 1fr;gap:24px;
    max-width:1000px;margin:0 auto;
  }
  .plate{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 32px;
    box-shadow:0 4px 24px rgba(20,33,61,0.06);
    transition:box-shadow .2s, transform .2s;
  }
  .plate:hover{box-shadow:0 12px 36px rgba(20,33,61,0.1);transform:translateY(-3px);}
  .plate .icon-wrap{
    width:52px;height:52px;border-radius:12px;background:var(--blue-light);
    display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  }
  .plate .icon{width:26px;height:26px;color:var(--blue);}
  .plate h3{font-size:1.25rem;}
  .plate .subhead{
    font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--slate);
    margin:6px 0 20px;
  }
  .plate ul{list-style:none;}
  .plate li{
    font-size:0.95rem;color:var(--ink);padding:10px 0;
    border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;
  }
  .plate li:first-child{border-top:none;}
  .plate li .b{color:var(--blue);flex-shrink:0;margin-top:1px;}

  .process{
    display:grid;grid-template-columns:repeat(4,1fr);gap:0;
    max-width:1000px;margin:0 auto;position:relative;
  }
  .process::before{
    content:"";position:absolute;top:15px;left:12%;right:12%;height:1px;
    background:var(--line);z-index:0;
  }
  .step{padding:0 20px;position:relative;z-index:1;}
  .step .n{
    width:30
